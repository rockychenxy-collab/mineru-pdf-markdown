[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mineru-converter"
version = "0.1.0"
description = "Cloud MinerU PDF-to-Markdown converter with Obsidian integration"
requires-python = ">=3.13"
dependencies = [
  "requests>=2.32,<3",
  "python-dotenv>=1.0,<2",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
mineru-converter = "mineru_converter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
